services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: seatreservation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seatreservation"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/seatreservation
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      AUTH_SECRET: local-secret
      ADMIN_TOKEN: admin-local
    ports:
      - "8080:8080"

volumes:
  pgdata:
