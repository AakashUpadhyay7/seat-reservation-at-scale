server:
  port: ${PORT:8080}
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:100}
      min-spare: 10
    accept-count: 500

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/seatreservation}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 2
      connection-timeout: 30000
      validation-timeout: 5000
      max-lifetime: 600000
  sql:
    init:
      mode: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

app:
  auth:
    secret: ${AUTH_SECRET:change-me-in-production}
    admin-token: ${ADMIN_TOKEN:admin-change-me}
  reservation:
    default-limit: ${PER_USER_LIMIT:4}
    idempotency-header: Idempotency-Key

logging:
  pattern:
    level: "%5p [requestId:%X{requestId}]"
